<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<tr>
    <td align="center" role="presentation"
        style="border:none;border-radius:24px;cursor:auto;padding:10px 25px;background-color:{backgroundColor}"
        valign="middle">
        <a href="{recoveryLink}"
           style="display:inline-block;background-color:{backgroundColor};color:#ffffff;font-weight:bold;padding:12px 25px;border-radius:5px;margin:0;text-decoration:none;text-transform:none;"
           target="_blank">
            <f:translate key="{labelKey}" extensionName="clubmanager" languageKey="{mailLanguage}" />
        </a>
    </td>
</tr>
