<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{typo3.systemConfiguration.backend.loginHighlightColor}">
  <f:then>
    <f:variable name="backgroundColor" value="{typo3.systemConfiguration.backend.loginHighlightColor}" />
  </f:then>
  <f:else>
    <f:variable name="backgroundColor" value="#1C8FC7" />
  </f:else>
</f:if>
<f:render partial="Header" arguments="{title:title}" />

<body>
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" class="body"
    style="background-color: {backgroundColor}">
    <tr>
      <td>&nbsp;</td>
      <td class="container">
        <div class="content">
          <table role="presentation" class="main">
            <tr>
              <td class="wrapper">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                  <f:render partial="Logo" arguments="{_all}" />
                  <tr>
                    <td style="padding-top:30px">
                      {htmlBody -> f:format.raw()}
                    </td>
                  </tr>
                  <f:render partial="Footer" arguments="{_all}" />
                </table>
              </td>
            </tr>
          </table>
        </div>
      </td>
      <td>&nbsp;</td>
    </tr>
  </table>
</body>
