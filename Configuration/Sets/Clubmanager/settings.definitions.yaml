categories:
  Clubmanager:
    label: "Clubmanager"
  Clubmanager.Journal:
    label: "Member Journal"
    parent: Clubmanager
  Clubmanager.Storage:
    label: "Data storage"
    parent: Clubmanager
  Clubmanager.Membership:
    label: "Membership types and levels"
    parent: Clubmanager
settings:
  clubmanager.memberJournalStoragePid:
    label: "Member Journal Storage Page"
    description: "Page/folder where new member journal entries will be stored. If not set (0), entries are stored in the same folder as the member record."
    category: Clubmanager.Journal
    type: int
    default: 0
  clubmanager.billingStoragePid:
    label: "Billing storage page"
    description: "Page/folder from which the frontend billing plugins read settlements and invoices. If not set (0), the configured member storage page is used. Backend modules use the folder selected in the page tree."
    category: Clubmanager.Storage
    type: int
    default: 0
  clubmanager.calendarStoragePid:
    label: "Calendar storage page"
    description: "Page/folder from which the frontend calendar plugins read events and dates. If not set (0), the configured member storage page is used. Backend modules use the folder selected in the page tree."
    category: Clubmanager.Storage
    type: int
    default: 0
  clubmanager.membershipMasterDataPids:
    label: "Pages with membership types and levels"
    description: "Comma-separated page uids. If set, only membership types and levels stored on these pages can be selected for members and journal entries of this site. If empty, records from any page can be selected."
    category: Clubmanager.Membership
    type: string
    default: ""
